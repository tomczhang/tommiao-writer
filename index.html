<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>公众号排版系统 · 汤姆喵</title>
<style>
  :root {
    --theme: rgb(20, 20, 20);
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #e5e5ea;
    --muted: #8e8e93;
    --wechat-font: "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont,
      "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei UI",
      "Microsoft YaHei", Arial, sans-serif;
    /* 贴图专用字体 —— 霞鹜文楷（本机安装），fallback 到系统字体 */
    --xhs-font: "LXGW WenKai", "霞鹜文楷", "PingFang SC", system-ui,
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--wechat-font);
    background: var(--bg);
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  header.top {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header.top h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .meta { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: #fff;
    color: #1d1d1f;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease;
  }
  button:hover { background: #f0f0f3; }
  button.primary {
    background: var(--theme);
    color: #fff;
    border-color: var(--theme);
  }
  button.primary:hover { background: #000; }
  button.ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border-color: transparent;
  }
  button.ai:hover { filter: brightness(1.08); }
  button.ai:disabled { opacity: .6; cursor: wait; }
  select {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: #1d1d1f;
  }
  /* 主题切换 chips */
  .theme-bar { display: flex; gap: 6px; align-items: center; }
  .theme-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
  }
  .theme-chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .theme-chip.active { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    height: calc(100vh - 61px);
  }
  .panel { background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
  .panel header.sub {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    background: #fafafa;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  /* 编辑器工具条 */
  .toolbar {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    background: #fcfcfd;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar .group-label {
    font-size: 11px; color: var(--muted); margin-right: 2px; flex-shrink: 0;
  }
  .toolbar button.tool {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 6px;
    background: #fff;
  }
  .toolbar button.tool:hover { background: #eef2ff; border-color: #c7d2fe; }
  #btn-punct {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    color: var(--muted); border-color: transparent; background: transparent;
  }
  #btn-punct.warn { color: #d9831f; border-color: #f5d9ac; background: #fff8ec; }
  /* 工具条悬浮样式预览 */
  .style-pop {
    position: fixed;
    z-index: 300;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
    padding: 12px 14px;
    width: 380px;
    max-height: 70vh;
    overflow: hidden;
    display: none;
    pointer-events: none;
  }
  .style-pop.show { display: block; }
  .style-pop .pop-label {
    margin: 0 0 8px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  textarea#input {
    flex: 1;
    width: 100%;
    border: 0;
    outline: 0;
    resize: none;
    padding: 20px;
    font-family: var(--wechat-font);
    font-size: 14px;
    line-height: 1.8;
    color: #1d1d1f;
    background: #fff;
  }
  .preview-wrap {
    flex: 1;
    overflow: auto;
    padding: 24px;
    background: #e9e9ed;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  /* 手机外框 —— 模拟微信公众号阅读视图 */
  .phone {
    width: 375px;
    background: #fff;
    border-radius: 36px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 0 0 10px #1d1d1f, 0 0 0 11px #2a2a2e;
    overflow: hidden;
    position: relative;
    margin: 8px 0 24px;
  }
  .phone-statusbar {
    height: 44px;
    background: #f7f7f7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    color: #1d1d1f;
    position: relative;
  }
  .phone-statusbar::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    width: 110px;
    height: 28px;
    background: #1d1d1f;
    border-radius: 18px;
  }
  .phone-statusbar .right { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .phone-navbar {
    height: 44px;
    background: #f7f7f7;
    border-bottom: 1px solid #e5e5ea;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 14px;
    color: #1d1d1f;
  }
  .phone-navbar .title {
    font-weight: 600;
    flex: 1;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 0 8px;
  }
  .phone-navbar .icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d1d1f;
    font-size: 18px;
  }
  .phone-screen {
    height: 640px;
    overflow-y: auto;
    background: #fff;
    -webkit-overflow-scrolling: touch;
  }
  .phone-content { padding: 16px 14px 40px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: rgb(20, 20, 20);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 200;
    max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 语义渲染宿主（贴图分页数据源，不可见） */
  #semantic-host { display: none; }
  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; height: auto; }
    .panel { min-height: 50vh; }
    .phone { width: 340px; }
  }

  /* ============ 小红书贴图导出 ============ */
  .exporter-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .exporter-overlay.show { display: flex; }
  .exporter {
    width: min(1180px, 96vw);
    height: min(820px, 94vh);
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .exporter-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .exporter-header strong { font-size: 14px; }
  .exporter-header .x {
    width: 28px; height: 28px;
    border: 0; background: transparent; cursor: pointer;
    font-size: 18px; color: var(--muted);
  }
  .exporter-header .x:hover { color: #1d1d1f; }
  .exporter-body {
    flex: 1;
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 0;
  }
  .exporter-side {
    border-right: 1px solid var(--border);
    padding: 18px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
    background: #fafafa;
  }
  .exporter-section h4 {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .hero-uploader {
    border: 1.5px dashed #c7c7cc;
    border-radius: 10px;
    height: 120px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    background: #fff;
    overflow: hidden;
    position: relative;
  }
  .hero-uploader.drag { border-color: #1d1d1f; background: #f0f0f3; }
  .hero-uploader img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .hero-uploader input[type="file"] { display: none; }
  .hero-row { display: flex; gap: 8px; margin-top: 6px; }
  .hero-row button { flex: 1; font-size: 12px; padding: 6px 8px; }
  .hint {
    font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5;
  }
  .exporter-side label {
    display: block;
    font-size: 12px; color: var(--muted); margin: 6px 0 4px;
  }
  .exporter-side input[type="text"],
  .exporter-side textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: #1d1d1f;
    resize: vertical;
  }
  .exporter-side textarea { line-height: 1.6; }
  .char-meta { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }
  .char-meta.warn { color: #d9831f; }
  .actions-col { display: flex; flex-direction: column; gap: 8px; }
  .actions-col button { width: 100%; }
  .exporter-pages {
    padding: 22px;
    overflow: auto;
    background: #e9e9ed;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
    align-content: start;
  }
  .thumb {
    width: 100%;
    aspect-ratio: 3/4;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    position: relative;
  }
  .thumb-inner {
    width: 1242px;
    height: 1656px;
    transform-origin: top left;
    pointer-events: none;
  }
  .thumb .idx {
    position: absolute;
    bottom: 8px; right: 8px;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: .04em;
  }
  .thumb .kind {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(255,255,255,.85);
    color: #1d1d1f;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
  }

  /* 离屏 slide 渲染舞台 —— html2canvas 抓这里 */
  .slide-stage {
    position: fixed;
    left: -99999px; top: 0;
    z-index: -1;
    pointer-events: none;
  }
  .slide {
    width: 1242px;
    height: 1656px;
    background: #fff;
    color: rgb(20, 20, 20);
    font-family: var(--xhs-font);
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
  }
  /* code 块仍保持等宽，避免文楷渲染代码段不清 */
  .slide.body .body-content code {
    font-family: "LXGW WenKai Mono", "霞鹜文楷 Mono",
      ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* 封面 slide */
  .slide.cover { padding: 70px; display: flex; flex-direction: column; }
  .slide.cover .hero {
    width: 100%;
    height: 826px;
    border-radius: 10px;
    background: #f2f2f4;
    object-fit: cover;
    display: block;
  }
  .slide.cover .hero-placeholder {
    width: 100%;
    height: 826px;
    border-radius: 10px;
    background: #f2f2f4;
    display: flex; align-items: center; justify-content: center;
    color: #b0b0b5;
    font-size: 28px;
    letter-spacing: .04em;
  }
  .slide.cover .cover-title {
    margin-top: 56px;
    font-size: 78px;
    line-height: 1.34;
    font-weight: 800;
    letter-spacing: .01em;
  }
  .slide.cover .cover-author {
    margin-top: 44px;
    font-size: 32px;
    display: flex; align-items: center; gap: 18px;
    color: rgb(20,20,20);
  }
  .slide.cover .cover-author::before {
    content: '';
    width: 6px; height: 38px;
    background: rgb(20, 20, 20);
    display: inline-block;
  }
  .slide.cover .cover-divider {
    margin-top: 36px;
    height: 2px;
    background: #d8d8dc;
  }
  /* 正文 slide */
  .slide.body { padding: 110px 90px 110px; }
  .slide.body .body-content {
    font-size: 40px;
    line-height: 1.85;
    color: rgb(20, 20, 20);
  }
  .slide.body .body-content > * { word-wrap: break-word; }
  .slide.body .body-content p {
    margin: 0 0 0.95em;
  }
  .slide.body .body-content h1,
  .slide.body .body-content h2,
  .slide.body .body-content h3 {
    margin: 0.9em 0 0.5em;
    font-weight: 700;
    line-height: 1.4;
  }
  .slide.body .body-content h1 { font-size: 56px; }
  .slide.body .body-content h2 {
    font-size: 48px;
    border-left: 8px solid rgb(99, 102, 241);
    padding-left: 22px;
  }
  .slide.body .body-content h3 { font-size: 44px; }
  .slide.body .body-content blockquote {
    margin: 0.9em 0;
    padding: 22px 30px;
    border-left: 6px solid rgb(99, 102, 241);
    background: #f3f3fd;
    color: #555;
  }
  .slide.body .body-content blockquote p { margin: 0 0 0.5em; }
  .slide.body .body-content blockquote p:last-child { margin: 0; }
  .slide.body .body-content blockquote.sem-code {
    background: #1e293b; color: #e2e8f0; border-left-color: #64748b;
  }
  .slide.body .body-content blockquote.sem-code code {
    background: transparent; color: #e2e8f0; padding: 0; font-size: 32px;
  }
  .slide.body .body-content ul,
  .slide.body .body-content ol {
    padding-left: 1.5em;
    margin: 0 0 0.95em;
  }
  .slide.body .body-content li { margin-bottom: 0.3em; }
  .slide.body .body-content li::marker { color: rgb(99, 102, 241); }
  .slide.body .body-content hr {
    border: 0; border-top: 2px solid #ddd; margin: 1em 0;
  }
  .slide.body .body-content del { color: #9ca3af; }
  .slide.body .body-content .wx-quote {
    margin: 1em 0;
    padding: 22px 26px;
    text-align: center;
    font-weight: 700;
    color: rgb(99, 102, 241);
    border-top: 2px solid rgb(99, 102, 241);
    border-bottom: 2px solid rgb(99, 102, 241);
    font-size: 42px;
  }
  .slide.body .body-content .wx-highlight {
    color: rgb(20, 20, 20);
    font-weight: 700;
    background: linear-gradient(transparent 60%, rgba(99,102,241,.20) 60%);
    padding: 0 4px;
  }
  .slide.body .body-content .wx-underline {
    border-bottom: 2px dashed rgb(99, 102, 241);
    padding-bottom: 2px;
  }
  .slide.body .body-content strong { font-weight: 700; }
  .slide.body .body-content em { font-style: italic; }
  .slide.body .body-content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f2f2f4;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 34px;
  }
  .slide .page-num {
    position: absolute;
    bottom: 56px; right: 90px;
    font-size: 22px;
    color: #a0a0a5;
    letter-spacing: .1em;
  }
  .slide.cover .page-num { color: #d0d0d5; bottom: 40px; right: 70px; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>公众号排版系统</h1>
    <div class="meta">手动排版 + AI 一键排版 · 双主题 · 合规校验（span leaf / 全角标点）</div>
  </div>
  <div class="theme-bar" id="theme-bar"></div>
  <div class="actions">
    <select id="ai-preset" title="本地 agent CLI 预设（cli-config.json）"></select>
    <button id="btn-ai" class="ai" title="调本地 agent CLI 做默认样式优化，结果回填编辑器，可继续手动改">AI 一键排版</button>
    <button id="btn-ai-undo" style="display:none" title="还原到 AI 排版前的内容">还原</button>
    <button id="btn-sample">示例</button>
    <button id="btn-clear">清空</button>
    <button id="btn-export">导出贴图</button>
    <button id="btn-copy" class="primary">复制到公众号</button>
  </div>
</header>

<main>
  <section class="panel">
    <header class="sub">
      <span>Markdown 源码（扩展语法，见工具条悬浮提示）</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <button id="btn-punct">标点 ✓</button>
        <span id="char-count">0 字</span>
      </span>
    </header>
    <div class="toolbar">
      <span class="group-label">行内</span>
      <span id="toolbar-inline" style="display:contents"></span>
    </div>
    <div class="toolbar">
      <span class="group-label">插入</span>
      <span id="toolbar-block" style="display:contents"></span>
    </div>
    <textarea id="input" placeholder="在这里粘贴或输入你的文章，点「示例」看全部语法..."></textarea>
  </section>
  <section class="panel">
    <header class="sub"><span>手机端预览（375pt · 所见即复制产物）</span><span id="phone-time">9:41</span></header>
    <div class="preview-wrap">
      <div class="phone">
        <div class="phone-statusbar">
          <span id="phone-time-bar">9:41</span>
          <span class="right">5G&nbsp;&nbsp;100%</span>
        </div>
        <div class="phone-navbar">
          <span class="icon">&lsaquo;</span>
          <span class="title" id="phone-title">公众号文章</span>
          <span class="icon">&middot;&middot;&middot;</span>
        </div>
        <div class="phone-screen">
          <div class="phone-content">
            <article id="preview"></article>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast">已复制</div>
<!-- 语义渲染宿主：贴图分页的数据源 -->
<div id="semantic-host"></div>

<!-- ============ 小红书贴图导出模态 ============ -->
<div id="exporter" class="exporter-overlay" role="dialog" aria-modal="true">
  <div class="exporter">
    <div class="exporter-header">
      <strong>导出小红书贴图 · 3:4 · 段落级分页</strong>
      <button class="x" id="exporter-close" title="关闭">×</button>
    </div>
    <div class="exporter-body">
      <aside class="exporter-side">
        <div class="exporter-section">
          <h4>封面 hero 图</h4>
          <label class="hero-uploader" id="hero-uploader">
            <span id="hero-placeholder-text">点击或拖入 hero 图</span>
            <img id="hero-preview" alt="" style="display:none">
            <input type="file" id="hero-file" accept="image/*">
          </label>
          <div class="hero-row">
            <button id="btn-hero-clear">清除</button>
            <button id="btn-copy-skill-prompt">复制 skill 指令</button>
          </div>
          <div class="hint">没有 hero 图？点「复制 skill 指令」粘到 agent 聊天，让 tommiao-xiaohongshu-cover skill 出一张。</div>
        </div>

        <div class="exporter-section">
          <h4>小红书 Caption</h4>
          <label>副标题（7-15 字）</label>
          <input type="text" id="cap-subtitle" placeholder="一句话，与主标题呼应">
          <div id="cap-subtitle-meta" class="char-meta">0 字</div>
          <label>简介（150-200 字）</label>
          <textarea id="cap-intro" rows="6" placeholder="以文章开头第一句为开头..."></textarea>
          <div id="cap-intro-meta" class="char-meta">0 字</div>
        </div>

        <div class="exporter-section actions-col">
          <button id="btn-copy-caption">复制 caption 文案</button>
          <button id="btn-export-zip" class="primary">下载全部 (ZIP)</button>
        </div>
      </aside>
