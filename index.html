<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>公众号排版系统 · 汤姆喵</title>
<style>
  :root {
    --theme: rgb(20, 20, 20);
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #e5e5ea;
    --muted: #8e8e93;
    --wechat-font: "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont,
      "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei UI",
      "Microsoft YaHei", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--wechat-font);
    background: var(--bg);
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  header.top {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header.top h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .meta { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: #fff;
    color: #1d1d1f;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease;
  }
  button:hover { background: #f0f0f3; }
  button.primary {
    background: var(--theme);
    color: #fff;
    border-color: var(--theme);
  }
  button.primary:hover { background: #000; }
  button.ai {
    background: #fff;
    color: #1d1d1f;
    border: 1px solid #1d1d1f;
    font-weight: 600;
  }
  button.ai:hover { background: #f0f0f3; }
  button.ai:disabled { opacity: .55; cursor: wait; }
  select {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: #1d1d1f;
  }
  /* 主题切换 chips */
  .theme-bar { display: flex; gap: 6px; align-items: center; }
  .theme-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
  }
  .theme-chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .theme-chip.active { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }

  main {
    --split: 50%;
    display: grid;
    grid-template-columns: var(--split) 6px 1fr;
    background: var(--border);
    height: calc(100vh - 61px);
  }
  /* 左右分栏拖拽手柄 */
  .split-handle {
    background: var(--border);
    cursor: col-resize;
    position: relative;
    transition: background .15s ease;
  }
  .split-handle::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 36px;
    border-radius: 2px;
    background: #c7c7cc;
  }
  .split-handle:hover, .split-handle.dragging { background: #d1d1d6; }
  .split-handle:hover::after, .split-handle.dragging::after { background: #8e8e93; }
  .panel { background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
  .panel header.sub {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    background: #fafafa;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  /* 编辑器工具条 */
  .toolbar {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    background: #fcfcfd;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar .group-label {
    font-size: 11px; color: var(--muted); margin-right: 2px; flex-shrink: 0;
  }
  .toolbar button.tool {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 6px;
    background: #fff;
  }
  .toolbar button.tool:hover { background: #eef2ff; border-color: #c7d2fe; }
  #btn-punct {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    color: var(--muted); border-color: transparent; background: transparent;
  }
  #btn-punct.warn { color: #d9831f; border-color: #f5d9ac; background: #fff8ec; }
  /* 工具条悬浮样式预览 */
  .style-pop {
    position: fixed;
    z-index: 300;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
    padding: 12px 14px;
    width: 380px;
    max-height: 70vh;
    overflow: hidden;
    display: none;
    pointer-events: none;
  }
  .style-pop.show { display: block; }
  .style-pop .pop-label {
    margin: 0 0 8px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  textarea#input {
    flex: 1;
    width: 100%;
    border: 0;
    outline: 0;
    resize: none;
    padding: 20px;
    font-family: var(--wechat-font);
    font-size: 14px;
    line-height: 1.8;
    color: #1d1d1f;
    background: #fff;
  }
  .preview-wrap {
    flex: 1;
    overflow: auto;
    padding: 24px;
    background: #e9e9ed;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  /* 手机外框 —— 模拟微信公众号阅读视图 */
  .phone {
    width: 375px;
    background: #fff;
    border-radius: 36px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 0 0 10px #1d1d1f, 0 0 0 11px #2a2a2e;
    overflow: hidden;
    position: relative;
    margin: 8px 0 24px;
  }
  .phone-statusbar {
    height: 44px;
    background: #f7f7f7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    color: #1d1d1f;
    position: relative;
  }
  .phone-statusbar::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    width: 110px;
    height: 28px;
    background: #1d1d1f;
    border-radius: 18px;
  }
  .phone-statusbar .right { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .phone-navbar {
    height: 44px;
    background: #f7f7f7;
    border-bottom: 1px solid #e5e5ea;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 14px;
    color: #1d1d1f;
  }
  .phone-navbar .title {
    font-weight: 600;
    flex: 1;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 0 8px;
  }
  .phone-navbar .icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d1d1f;
    font-size: 18px;
  }
  .phone-screen {
    height: 640px;
    overflow-y: auto;
    background: #fff;
    -webkit-overflow-scrolling: touch;
  }
  .phone-content { padding: 16px 14px 40px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: rgb(20, 20, 20);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 200;
    max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; height: auto; }
    .split-handle { display: none; }
    .panel { min-height: 50vh; }
    .phone { width: 340px; }
  }

</style>
</head>
<body>
<header class="top">
  <div>
    <h1>公众号排版系统</h1>
    <div class="meta">手动排版 + AI 一键排版 · 双主题 · 合规校验（span leaf / 全角标点）</div>
  </div>
  <div class="theme-bar" id="theme-bar"></div>
  <div class="actions">
    <select id="ai-preset" title="本地 agent CLI 预设（cli-config.json）"></select>
    <button id="btn-ai" class="ai" title="调本地 agent CLI 做默认样式优化，结果回填编辑器，可继续手动改">AI 一键排版</button>
    <button id="btn-ai-undo" style="display:none" title="还原到 AI 排版前的内容">还原</button>
    <button id="btn-sample">示例</button>
    <button id="btn-clear">清空</button>
    <button id="btn-copy" class="primary">复制到公众号</button>
  </div>
</header>

<main>
  <section class="panel">
    <header class="sub">
      <span>Markdown 源码（扩展语法，见工具条悬浮提示）</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <button id="btn-punct">标点 ✓</button>
        <span id="char-count">0 字</span>
      </span>
    </header>
    <div class="toolbar">
      <span class="group-label">行内</span>
      <span id="toolbar-inline" style="display:contents"></span>
    </div>
    <div class="toolbar">
      <span class="group-label">插入</span>
      <span id="toolbar-block" style="display:contents"></span>
    </div>
    <textarea id="input" placeholder="在这里粘贴或输入你的文章，点「示例」看全部语法..."></textarea>
  </section>
  <div class="split-handle" id="split-handle" title="拖拽调整左右宽度"></div>
  <section class="panel">
    <header class="sub"><span>手机端预览（375pt · 所见即复制产物）</span><span id="phone-time">9:41</span></header>
    <div class="preview-wrap">
      <div class="phone">
        <div class="phone-statusbar">
          <span id="phone-time-bar">9:41</span>
          <span class="right">5G&nbsp;&nbsp;100%</span>
        </div>
        <div class="phone-navbar">
          <span class="icon">&lsaquo;</span>
          <span class="title" id="phone-title">公众号文章</span>
          <span class="icon">&middot;&middot;&middot;</span>
        </div>
        <div class="phone-screen">
          <div class="phone-content">
            <article id="preview"></article>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast">已复制</div>

<script src="assets/themes.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
