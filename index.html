<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>排版机® · 汤姆喵</title>
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #555555;
    --muted: #9a938a;
    --cream: #faf6ec;
    --panel: #ffffff;
    --border: #e8e2d4;
    --border-strong: #1a1a1a;
    --marker: #ffe28a;
    --marker-soft: #fff3c9;
    --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
      "PingFang SC", "Hiragino Sans GB", "Noto Sans SC",
      "Microsoft YaHei", sans-serif;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 26px rgba(56, 45, 27, 0.07);
    --shadow-lift: 0 8px 18px rgba(56, 45, 27, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    /* Oil® 式奶油底 + 极淡网格纹理 */
    background-color: var(--cream);
    background-image:
      linear-gradient(rgba(26, 26, 26, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26, 26, 26, 0.035) 1px, transparent 1px);
    background-size: 56px 56px;
  }

  /* ============ 顶部：品牌字标 + 主题 + 动作 ============ */
  header.top {
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ink);
    align-self: center;
    flex-shrink: 0;
  }
  .brand h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -1.2px;
    line-height: 1;
  }
  .brand h1 sup {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0;
    vertical-align: super;
  }
  .brand .sub {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* 胶囊按钮体系 */
  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.85);
    color: var(--ink-soft);
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease-out;
  }
  button:hover {
    color: var(--ink);
    border-color: var(--ink);
    transform: translateY(-1px);
    box-shadow: var(--shadow-lift);
  }
  button.primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  button.primary:hover { background: #000; color: #fff; }
  button.ai {
    background: rgba(255, 255, 255, 0.85);
    color: var(--ink);
    border: 1px solid var(--ink);
    font-weight: 700;
  }
  button.ai:hover { background: var(--marker); border-color: var(--ink); }
  button.ai:disabled { opacity: .55; cursor: wait; transform: none; box-shadow: none; }
  select {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.85);
    color: var(--ink-soft);
  }

  /* 主题切换 chips —— 黄色马克笔选中态 */
  .theme-bar { display: flex; gap: 6px; align-items: center; }
  .theme-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; font-size: 12px; font-weight: 700;
  }
  .theme-chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .theme-chip.active {
    background: var(--marker);
    color: var(--ink);
    border-color: var(--ink);
  }

  /* ============ 主区：两张悬浮白卡 + 拖拽手柄 ============ */
  main {
    --split: 50%;
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: var(--split) 14px 1fr;
    padding: 4px 20px 24px;
  }
  .panel {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .split-handle {
    cursor: col-resize;
    position: relative;
    transition: opacity .15s ease;
  }
  .split-handle::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 3px; height: 40px;
    border-radius: 3px;
    background: #d5cdbc;
  }
  .split-handle:hover::after, .split-handle.dragging::after { background: var(--ink); }

  /* 面板头：N° 编号 + 小型大写标签 */
  .panel header.sub {
    padding: 12px 18px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: #fffdf8;
  }
  .panel header.sub .no {
    color: var(--ink);
    margin-right: 8px;
  }

  /* 编辑器工具条 */
  .toolbar {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: #fffdf8;
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar .group-label {
    font-size: 10px; font-weight: 700; color: var(--muted);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-right: 4px; flex-shrink: 0;
  }
  .toolbar button.tool {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 11px;
    background: #fff;
  }
  .toolbar button.tool:hover {
    background: var(--marker-soft);
    border-color: #e7c96a;
    transform: none;
    box-shadow: none;
  }
  .toolbar button.tool .glyph {
    color: var(--muted);
    font-size: 11px;
    margin-right: 5px;
    font-family: ui-monospace, Menlo, monospace;
  }
  #btn-punct {
    font-size: 11px; padding: 4px 11px;
    color: var(--muted); border-color: transparent; background: transparent;
    letter-spacing: 0; text-transform: none;
  }
  #btn-punct:hover { transform: none; box-shadow: none; border-color: var(--border); }
  #btn-punct.warn { color: #b26a00; border-color: #e7c96a; background: var(--marker-soft); }
  #char-count { letter-spacing: 0; text-transform: none; font-weight: 600; }

  /* 预览正文字号步进器 */
  .preview-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: 0;
    text-transform: none;
  }
  .font-stepper {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
  }
  .font-stepper-label {
    padding-left: 7px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
  }
  .font-stepper button {
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1;
  }
  .font-stepper button:hover {
    background: var(--marker-soft);
    color: var(--ink);
    transform: none;
    box-shadow: none;
  }
  .font-stepper button:disabled {
    color: var(--border);
    cursor: not-allowed;
  }
  .font-stepper button:disabled:hover { background: transparent; }
  #body-font-value {
    min-width: 34px;
    color: var(--ink);
    font-size: 11px;
    font-weight: 700;
    text-align: center;
  }

  /* 默认签名设置 */
  .signature-dialog {
    width: min(440px, calc(100vw - 32px));
    padding: 0;
    border: 0;
    border-radius: 20px;
    background: transparent;
    color: var(--ink);
  }
  .signature-dialog::backdrop {
    background: rgba(26, 26, 26, 0.34);
    backdrop-filter: blur(3px);
  }
  .signature-card {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: 0 24px 64px rgba(26, 26, 26, 0.2);
  }
  .signature-card h2 {
    margin: 0 0 6px;
    font-size: 19px;
    letter-spacing: -0.4px;
  }
  .signature-card .dialog-desc {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
  .signature-fields {
    display: grid;
    gap: 14px;
    margin: 0;
    padding: 0;
    border: 0;
  }
  .signature-field {
    display: grid;
    gap: 7px;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 700;
  }
  .signature-field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: #fffdf8;
    color: var(--ink);
    font: 500 14px/1.4 var(--font);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .signature-field input:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px var(--marker-soft);
  }
  .signature-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 22px;
  }

  /* 工具条悬浮样式预览 */
  .style-pop {
    position: fixed;
    z-index: 300;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(56, 45, 27, 0.18);
    padding: 14px 16px;
    width: 380px;
    max-height: 70vh;
    overflow: hidden;
    display: none;
    pointer-events: none;
  }
  .style-pop.show { display: block; }
  .style-pop .pop-label {
    margin: 0 0 10px;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  textarea#input {
    flex: 1;
    width: 100%;
    border: 0;
    outline: 0;
    resize: none;
    padding: 20px;
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.9;
    color: var(--ink);
    background: #fff;
  }

  /* 预览区 —— 暖灰舞台 + 手机 */
  .preview-wrap {
    flex: 1;
    overflow: auto;
    padding: 24px;
    background: #f5f1e6;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
  }
  /* Oil® 式背景幽灵编号 */
  .preview-wrap::before {
    content: '02';
    position: absolute;
    right: 18px;
    bottom: 4px;
    font-size: 120px;
    font-weight: 800;
    letter-spacing: -6px;
    color: rgba(26, 26, 26, 0.045);
    line-height: 1;
    pointer-events: none;
  }
  .phone {
    width: 375px;
    background: #fff;
    border-radius: 36px;
    box-shadow: 0 8px 32px rgba(56, 45, 27, 0.14), 0 0 0 10px #1a1a1a, 0 0 0 11px #2a2a2e;
    overflow: hidden;
    position: relative;
    margin: 8px 0 24px;
    z-index: 1;
  }
  .phone-statusbar {
    height: 44px;
    background: #f7f7f7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    color: #1d1d1f;
    position: relative;
  }
  .phone-statusbar::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    width: 110px;
    height: 28px;
    background: #1d1d1f;
    border-radius: 18px;
  }
  .phone-statusbar .right { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .phone-navbar {
    height: 44px;
    background: #f7f7f7;
    border-bottom: 1px solid #e5e5ea;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 14px;
    color: #1d1d1f;
  }
  .phone-navbar .title {
    font-weight: 600;
    flex: 1;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 0 8px;
  }
  .phone-navbar .icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d1d1f;
    font-size: 18px;
  }
  .phone-screen {
    height: 640px;
    overflow-y: auto;
    background: #fff;
    -webkit-overflow-scrolling: touch;
  }
  .phone-content { padding: 16px 14px 40px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 200;
    max-width: 80vw;
    box-shadow: var(--shadow-lift);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; height: auto; padding: 4px 16px 16px; row-gap: 14px; }
    .split-handle { display: none; }
    .panel { min-height: 50vh; }
    .phone { width: 340px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <h1>排版机<sup>®</sup></h1>
    <span class="sub">Markdown in · WeChat out / AI-powered</span>
  </div>
  <div class="theme-bar" id="theme-bar"></div>
  <div class="actions">
    <select id="ai-preset" title="本地 agent CLI 预设（cli-config.json）"></select>
    <button id="btn-ai" class="ai" title="调本地 agent CLI 做默认样式优化，结果回填编辑器，可继续手动改">AI 一键排版</button>
    <button id="btn-ai-undo" style="display:none" title="还原到 AI 排版前的内容">还原</button>
    <button id="btn-sample">示例</button>
    <button id="btn-clear">清空</button>
    <button id="btn-signature" title="设置插入签名块时使用的默认作者信息">默认签名</button>
    <button id="btn-copy" class="primary">复制到公众号 →</button>
  </div>
</header>

<main>
  <section class="panel">
    <header class="sub">
      <span><span class="no">N°01</span>Markdown 源码</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <button id="btn-punct">标点 ✓</button>
        <span id="char-count">0 字</span>
      </span>
    </header>
    <div class="toolbar">
      <span class="group-label">行内</span>
      <span id="toolbar-inline" style="display:contents"></span>
    </div>
    <div class="toolbar">
      <span class="group-label">插入</span>
      <span id="toolbar-block" style="display:contents"></span>
    </div>
    <textarea id="input" placeholder="在这里粘贴或输入你的文章，点「示例」看全部语法..."></textarea>
  </section>
  <div class="split-handle" id="split-handle" title="拖拽调整左右宽度"></div>
  <section class="panel">
    <header class="sub">
      <span><span class="no">N°02</span>手机预览 · 所见即复制产物</span>
      <span class="preview-meta">
        <span class="font-stepper" role="group" aria-label="调整正文字体大小">
          <span class="font-stepper-label">正文</span>
          <button id="btn-font-dec" type="button" aria-label="减小正文字体">−</button>
          <output id="body-font-value" aria-live="polite">15px</output>
          <button id="btn-font-inc" type="button" aria-label="增大正文字体">＋</button>
        </span>
        <span id="phone-time">9:41</span>
      </span>
    </header>
    <div class="preview-wrap">
      <div class="phone">
        <div class="phone-statusbar">
          <span id="phone-time-bar">9:41</span>
          <span class="right">5G&nbsp;&nbsp;100%</span>
        </div>
        <div class="phone-navbar">
          <span class="icon">&lsaquo;</span>
          <span class="title" id="phone-title">公众号文章</span>
          <span class="icon">&middot;&middot;&middot;</span>
        </div>
        <div class="phone-screen">
          <div class="phone-content">
            <article id="preview"></article>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast">已复制</div>

<dialog id="signature-dialog" class="signature-dialog" aria-labelledby="signature-dialog-title">
  <form id="signature-form" class="signature-card">
    <h2 id="signature-dialog-title">默认签名</h2>
    <p class="dialog-desc">插入签名或 AI 排版时会把这组信息直接写入 Markdown，之后可在正文中单独修改。</p>
    <fieldset class="signature-fields">
      <label class="signature-field">
        作者名
        <input id="signature-name" name="signature-name" type="text" maxlength="40" required autocomplete="name" placeholder="例如：汤姆喵" />
      </label>
      <label class="signature-field">
        一句话简介（可选）
        <input id="signature-bio" name="signature-bio" type="text" maxlength="100" placeholder="例如：一个重度 AI 使用者的真实观察" />
      </label>
    </fieldset>
    <div class="signature-actions">
      <button id="btn-signature-cancel" type="button">取消</button>
      <button class="primary" type="submit">保存默认签名</button>
    </div>
  </form>
</dialog>

<script src="assets/themes.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
